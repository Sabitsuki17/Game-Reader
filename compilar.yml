name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Sirve tanto si subiste las carpetas del proyecto como si subiste solo Game-Reader.zip
      - name: Localizar el proyecto
        run: |
          set -e
          if [ ! -f settings.gradle ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -1 || true)
            if [ -n "$ZIP" ]; then
              mkdir -p _proyecto
              unzip -q -o "$ZIP" -d _proyecto
            fi
          fi
          SETTINGS=$(find . -maxdepth 3 -name settings.gradle -printf '%d %p\n' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$SETTINGS" ]; then
            echo "No se encontró settings.gradle: sube el proyecto completo o Game-Reader.zip"
            exit 1
          fi
          echo "PROYECTO=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Compilar el APK
        working-directory: ${{ env.PROYECTO }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace -Pvc=${{ github.run_number }} -Pvn=1.${{ github.run_number }}

      - name: Copiar el APK
        run: cp "${{ env.PROYECTO }}/app/build/outputs/apk/release/app-release.apk" Game-Reader.apk

      - name: Guardar el APK en esta ejecución
        uses: actions/upload-artifact@v4
        with:
          name: Game-Reader-APK
          path: Game-Reader.apk

      - name: Publicar el APK como versión (descarga directa)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Game-Reader ${{ github.run_number }}
          files: Game-Reader.apk
